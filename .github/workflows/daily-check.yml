name: Daily Update Check

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 1:00 = 北京时间 9:00
  workflow_dispatch:       # 可手动触发

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch announcements from hrss.xizang.gov.cn
        run: |
          echo "Fetching announcement list..."
          curl -sL "https://hrss.xizang.gov.cn/xwzx/tzgg/" -o /tmp/announcements.html
          echo "Page fetched: $(wc -c < /tmp/announcements.html) bytes"

      - name: Parse today's announcements
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BEIJING_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "Today (UTC): $TODAY"
          echo "Today (Beijing): $BEIJING_DATE"

          # Parse HTML to extract announcements using a more robust Python script
          python3 << 'PYEOF'
          import re, json, sys
          from datetime import datetime, timedelta

          def beijing_today_str():
              return (datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d')

          def extract_announcements(html):
              # 宽松匹配 <a ... href="./...">标题</a>
              pattern = re.compile(r'<a[^>]+href=["\'](?P<href>\./[^"\']+)["\'][^>]*>(?P<title>.*?)</a>', re.S|re.I)
              items = []
              for m in pattern.finditer(html):
                  href = m.group('href').strip()
                  raw_title = m.group('title')
                  title = re.sub(r'<[^>]+>', '', raw_title).strip()
                  # 尝试在 raw_title 周围查找日期 (yyyy-mm-dd)
                  date_match = re.search(r'(\d{4}-\d{2}-\d{2})', raw_title)
                  date = date_match.group(1) if date_match else None
                  items.append({'href': href, 'title': title, 'date': date})
              return items

          try:
              with open('/tmp/announcements.html', 'r', encoding='utf-8') as f:
                  html = f.read()
          except Exception as e:
              print('ERROR: failed to read fetched HTML:', e, file=sys.stderr)
              html = ''

          beijing_today = beijing_today_str()
          results = []
          try:
              candidates = extract_announcements(html)
              keywords = ['公务员','事业','招聘','考录','遴选','三支一扶','教师','国考','人才引进','岗位','招录','报名','考试','笔试','面试']
              for c in candidates:
                  title = c.get('title','')
                  date = c.get('date')
                  # 如果存在日期且与今天不符则跳过
                  if date and date != beijing_today:
                      continue
                  if any(kw in title for kw in keywords):
                      url = 'https://hrss.xizang.gov.cn/xwzx/tzgg/' + c['href'].lstrip('./')
                      results.append({'title': title, 'url': url, 'date': date or beijing_today, 'source': '西藏人社厅'})
          except Exception as e:
              print('ERROR: parsing failed:', e, file=sys.stderr)

          out = {'date': beijing_today, 'count': len(results), 'items': results, 'updated_at': datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}
          try:
              with open('/tmp/daily-updates.json','w',encoding='utf-8') as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)
              print('WROTE /tmp/daily-updates.json, count=', len(results))
          except Exception as e:
              print('ERROR: failed to write json:', e, file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Update daily-updates.json
        run: |
          if [ -f /tmp/daily-updates.json ]; then
            cp /tmp/daily-updates.json js/daily-updates.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "xizang-job-site-bot"
          git config user.email "bot@xizang-job-site.github.io"
          git add js/daily-updates.json
          git diff --cached --quiet || (git commit -m "chore: daily update $(TZ='Asia/Shanghai' date +%Y-%m-%d)" && git push)
